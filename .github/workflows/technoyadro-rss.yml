name: TechnoYadro RSS
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: technoyadro-rss
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Offline unit tests
        run: python3 news-rss/collector.py --test
      - name: Collect public RSS candidates
        run: python3 news-rss/collector.py
      - name: Upload short-lived candidate list
        uses: actions/upload-artifact@v7.0.2
        with:
          name: technoyadro-rss-candidates
          path: rss-output/news.json
          retention-days: 1
          if-no-files-found: error
