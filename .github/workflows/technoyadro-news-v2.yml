name: TechnoYadro News Engine 2.0 (pilot)
on:
  schedule:
    - cron: '7,37 * * * *'
  push:
    branches: [main]
    paths:
      - 'news-rss/engine_v2.py'
      - 'news-rss/collector.py'
      - '.github/workflows/technoyadro-news-v2.yml'
  workflow_run:
    workflows: ['TechnoYadro RSS']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      approved_article_hosts:
        description: 'Comma-separated hosts with verified publisher permission; leave empty for RSS-only'
        required: false
        default: ''
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: technoyadro-news-v2
  cancel-in-progress: false
jobs:
  collect:
    # Only trust the scheduled completion of our own baseline workflow on main.
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'schedule' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check whether scheduled backup collection is needed
        id: freshness
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # A fresh successful primary run makes the backup redundant.
          # On an API error, prefer collecting over silently skipping.
          if ! gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/technoyadro-news-v2.yml/runs?branch=main&status=success&per_page=10" > "${RUNNER_TEMP}/technoyadro-recent-runs.json"; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Freshness API unavailable; running fallback collection"
            exit 0
          fi
          python3 - <<'PY'
          import datetime as dt, json, os
          from pathlib import Path
          now = dt.datetime.now(dt.timezone.utc)
          runs = json.loads((Path(os.environ['RUNNER_TEMP'])/'technoyadro-recent-runs.json').read_text())['workflow_runs']
          fresh = False
          for run in runs:
              if run.get('conclusion') != 'success' or run.get('event') not in ('push','schedule','workflow_dispatch','workflow_run'):
                  continue
              started = run.get('run_started_at') or run.get('created_at')
              if started:
                  age = (now - dt.datetime.fromisoformat(started.replace('Z','+00:00'))).total_seconds()
                  if 0 <= age <= 2700:
                      # A skipped backup has no collect step; never count it as fresh evidence.
                      if run.get('event') == 'workflow_run':
                          continue
                      fresh = True
                      break
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('skip=' + str(fresh).lower() + '\n')
          print('Fresh primary run within 45 minutes:', fresh)
          PY
      - uses: actions/checkout@v4
        if: steps.freshness.outputs.skip != 'true'
        with:
          persist-credentials: false
      - name: Test baseline RSS
        if: steps.freshness.outputs.skip != 'true'
        run: python3 news-rss/collector.py --test
      - name: Test News Engine 2.0
        if: steps.freshness.outputs.skip != 'true'
        run: python3 news-rss/engine_v2.py --test
      # Scheduled/push runs use the repository variable only after publisher permission is documented.
      # Manual runs keep their explicit input; an empty input remains RSS-only.
      - name: Collect and rank
        if: steps.freshness.outputs.skip != 'true'
        env:
          APPROVED_ARTICLE_HOSTS: ${{ github.event_name != 'workflow_dispatch' && vars.TECHNOYADRO_APPROVED_ARTICLE_HOSTS || inputs.approved_article_hosts }}
        run: python3 news-rss/engine_v2.py
      - name: Upload short-lived evidence
        if: steps.freshness.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: technoyadro-news-v2
          path: rss-output/news-v2.json
          retention-days: 1
          if-no-files-found: error
